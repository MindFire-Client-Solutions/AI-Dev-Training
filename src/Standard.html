    <script>
        $('#rzForm option').each(function(){
            var text=$(this).text()
            if (text.length>56)
                $(this).val(text).text(text.substr(0,55)+'…')
        });

        function validateEmail(email) {
        var re = /^(([^<>()[\]\\.,;:\s@\"]+(\.[^<>()[\]\\.,;:\s@\"]+)*)|(\".+\"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/;
        return re.test(email);
        }
        function validatePhone(phone) {
            pnum = phone.replace(/\s+/g, "");
            var re = /^((\+[1-9]{1,4}[ \-]*)|([0-9]?\([0-9]{2,3}\)[ \-]*)|(\([0-9]{2,3}\)[ \-]*)|([0-9]{2,4})[ \-]*)*?[0-9]{3,4}?[ \-]*[0-9]{3,4}?$/; 
            return pnum.length > 9 && re.test(pnum);
        }
        function validateZip(zip) {
            pnum = zip.replace(/\s+/g, "");
            var re = /^(\d{5})?$/;
            return re.test(pnum);
        }
        function validateZipUS(zip) {
            pnum = zip.replace(/\s+/g, "");
            var re= /(^\d{5}$)|(^\d{5}[-|—]\d{4}$)/;
            return re.test(pnum);
        }
    </script>
